{% extends "base.html" %}
{% block titulo %}Ingresar - Sistema de inventario{% endblock %}
{% block contenido %}
  <div class="centrado">
    <span class="marca-ingreso">Inventario</span>
    <h1>Ingresar</h1>
    <form method="post" class="tarjeta">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <p class="error" role="alert">{{ form.non_field_errors.0 }}</p>
      {% endif %}
      <div class="campo">
        <label for="{{ form.username.id_for_label }}">Usuario</label>
        {{ form.username }}
      </div>
      <div class="campo">
        <label for="{{ form.password.id_for_label }}">Contraseña</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="grande">Ingresar</button>
    </form>
  </div>
{% endblock %}
