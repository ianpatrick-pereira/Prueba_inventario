{% extends "base.html" %}
{% block titulo %}Quitar código - Sistema de inventario{% endblock %}
{% block contenido %}
  <h1>Quitar {{ tipo }}</h1>
  <form method="post" class="tarjeta">
    {% csrf_token %}
    <p>¿Seguro que quieres quitar el código <strong>{{ objeto }}</strong> del producto <strong>{{ objeto.producto }}</strong>?</p>
    <p><button type="submit" class="peligro">Sí, quitar</button>
      <a class="boton secundario" href="{% url 'producto_detalle' objeto.producto_id %}">Cancelar</a></p>
  </form>
{% endblock %}
